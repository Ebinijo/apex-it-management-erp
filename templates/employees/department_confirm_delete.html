{% extends 'base.html' %}

{% block title %}Confirm Delete: {{ department.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-custom p-4 p-md-5 text-center">
      <div class="d-inline-flex p-3 rounded-circle bg-danger-subtle text-danger mx-auto mb-3">
        <i class="bi bi-trash-fill fs-1"></i>
      </div>
      <h4 class="fw-bold text-dark mb-2">Delete Department?</h4>
      <p class="text-secondary small mb-4">
        Are you sure you want to delete the department <strong>{{ department.name }}</strong> (<code>{{ department.code }}</code>)?
      </p>

      <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'employees:department_list' %}" class="btn btn-light border px-4">Cancel</a>
          <button type="submit" class="btn btn-danger px-4 fw-semibold">
            <i class="bi bi-trash me-1"></i> Confirm Delete
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
